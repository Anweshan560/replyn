name: Instagram Sender

# Sends one Instagram DM a day from the throwaway sender account to the Instagram account connected
# to the test workspace, so the inbox tests (tests/inbox/instagram) always have a fresh inbound
# message to find and reply to. See README, "Daily Instagram message".
#
# cron-job.org starts it at 06:15 Nepal time, before the 06:30 daily run (GitHub's own timer runs
# hours late). No GitHub schedule as a backup: a late duplicate would send a second message.
# It logs in with the saved session in the IG_SENDER_SESSION secret, never with the password. When
# Instagram ends that session, the run fails and opens an alert issue: log in again with
# `npm run instagram:login` and update the secret.
on:
  workflow_dispatch:

# Never two sends at once.
concurrency:
  group: instagram-sender
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  send:
    name: Send today's message
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_SENDER_SESSION: ${{ secrets.IG_SENDER_SESSION }}
      IG_RECEIVER_HANDLE: ${{ secrets.IG_RECEIVER_HANDLE }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Exit code 2 means Instagram ended the session; anything else non-zero is another failure.
      # No screenshots are uploaded: the repository is public and they would show the DM thread.
      - name: Send the message
        id: send
        run: |
          set +e
          npm run instagram:send
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Alert that the session expired
        if: failure() && steps.send.outputs.code == '2'
        run: |
          bash .github/scripts/alert.sh ci-alert-instagram-session 'Log in to the Instagram sender again' \
            "Instagram ended the sender's session, so today's message was not sent: $RUN_URL. Run \`npm run instagram:login\`, then paste secrets/instagram-sender.json.base64.txt into the IG_SENDER_SESSION secret and re-run this workflow."

      - name: Alert that the message was not sent
        if: failure() && steps.send.outputs.code != '2'
        run: |
          bash .github/scripts/alert.sh ci-alert-instagram-send 'The daily Instagram message was not sent' \
            "The Instagram sender failed, so today's inbox tests will fail too: $RUN_URL. Run \`npm run instagram:send -- --headed\` locally to see what Instagram shows."
