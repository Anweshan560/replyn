name: Playwright Tests
# Names hand-started runs after their suite, so the watchdog can tell the daily regression from the
# quick check a deploy starts. Other runs keep GitHub's usual name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Playwright Tests ({0})', inputs.suite) || '' }}

# What runs when:
#   - push / pull request: code checks (types, formatting) and the quick check (smoke + API tests)
#   - after a deploy: the quick check, started by the deploy. See README, "After a deploy".
#   - every morning, 6:30 Nepal time: full regression (everything except the exclusive tests).
#     cron-job.org starts it through the API, so it shows as a manual run. GitHub's own timer ran
#     hours late. Daily Run Watchdog alerts if it does not start.
#   - every Sunday, 5:30 Nepal time: exclusive tests (they change workspace-wide settings, so they run
#     when nobody is working)
#   - by hand (Actions tab > Playwright Tests > Run workflow): pick any of the above
# Scheduled runs only start from the default branch (main), and GitHub may start them late.
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '45 23 * * 6' # 05:30 Nepal time every Sunday (= 23:45 UTC on Saturday); cron times are UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options:
          - quick
          - regression
          - exclusive
          - all
        default: regression

# Every run uses the same shared test workspace, so never run two at once: a new run waits for
# the one in progress instead.
concurrency:
  group: replyn-test-workspace
  cancel-in-progress: false

jobs:
  checks:
    name: Code checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      flaky: ${{ steps.run_tests.outputs.flaky }}
    env:
      TEST_USERNAME: ${{ secrets.SECRETU }}
      TEST_PASSWORD: ${{ secrets.SECRETP }}
      # The limited Agent account for the permission tests; they are skipped while these are unset.
      TEST_AGENT_USERNAME: ${{ secrets.TEST_AGENT_USERNAME }}
      TEST_AGENT_PASSWORD: ${{ secrets.TEST_AGENT_PASSWORD }}
      # Set a repository variable TEST_WORKSPACE to change it without editing this file.
      TEST_WORKSPACE: ${{ vars.TEST_WORKSPACE || 'Workspace for reports testing' }}
      # Failed tests are written to this Google Sheet (see README, "Failed tests sheet").
      FAILED_TESTS_SHEET_ID: ${{ vars.FAILED_TESTS_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

    steps:
      - name: Choose the tests to run
        id: suite
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            "schedule/45 23 * * 6") suite=exclusive ;;
            workflow_dispatch/*)  suite="${{ inputs.suite }}" ;;
            *)                    suite=quick ;;
          esac
          echo "Running: $suite"
          echo "name=$suite" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Deletes test data older than 2 hours that earlier runs left behind (only records marked
      # "qa" + 6 digits, only in the test workspace). Never fails the run. See tests/cleanup.
      - name: Clean up old test data
        if: steps.suite.outputs.name != 'quick'
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/cleanup
        run: npm run test:sweep -- --output=test-results/cleanup

      - name: Run tests
        id: run_tests
        run: |
          case "${{ steps.suite.outputs.name }}" in
            quick)      npx playwright test --project=smoke --project=api ;;
            regression) npm run test:regression ;;
            exclusive)  npm run test:exclusive ;;
            all)        npm run test:all ;;
          esac

      # Flaky tests tagged @quarantine are left out above. They still run every day, but their
      # failures only warn (and go to the sheet), so they cannot turn the run red. See README.
      - name: Run quarantined tests (warn only)
        if: always() && (steps.suite.outputs.name == 'regression' || steps.suite.outputs.name == 'all')
        continue-on-error: true
        env:
          # A report and results folder of their own, so the regression's are not overwritten.
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/quarantine
        run: npm run test:quarantine -- --output=test-results/quarantine

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.suite.outputs.name }}-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.suite.outputs.name }}-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # Tell someone when a scheduled or hand-started run on main fails, or passes only after retries.
  # Pushes and pull requests are left out: whoever made them is watching. See README, "Alerts".
  alert:
    name: Alert
    needs: tests
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.tests.result != 'success' || (needs.tests.outputs.flaky != '' && needs.tests.outputs.flaky != '0'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Alert about a failed run
        if: needs.tests.result != 'success'
        run: |
          bash .github/scripts/alert.sh ci-alert-failed 'The test run failed' \
            "The run ended with \"${{ needs.tests.result }}\": $RUN_URL"

      - name: Record flaky tests
        if: needs.tests.result == 'success'
        run: |
          bash .github/scripts/alert.sh ci-alert-flaky 'Flaky tests in the daily run' \
            "${{ needs.tests.outputs.flaky }} flaky test(s), which failed and then passed on retry: $RUN_URL"
